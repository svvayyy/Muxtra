<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="720" viewBox="0 0 2400 720" role="img" aria-labelledby="title description">
  <title id="title">Muxtra</title>
  <desc id="description">Many agents. One codebase.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03040b" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#070816" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#08080f" stop-opacity="0.78"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#070711" stop-opacity="0"/>
      <stop offset="0.64" stop-color="#04040b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#010106" stop-opacity="0.78"/>
    </radialGradient>
    <radialGradient id="horizonGlow" cx="50%" cy="96%" r="54%">
      <stop offset="0" stop-color="#8d76f4" stop-opacity="0.23"/>
      <stop offset="0.5" stop-color="#5540bd" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0a0912" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.46" stop-color="#f8f6ff"/>
      <stop offset="0.74" stop-color="#d5ccff"/>
      <stop offset="1" stop-color="#907bf4"/>
    </linearGradient>
    <filter id="wordShadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020208" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#7862eb" flood-opacity="0.16"/>
    </filter>
  </defs>

  <image href="hero-lake.jpg" width="2400" height="720" preserveAspectRatio="xMidYMid slice"/>
  <rect width="2400" height="720" fill="url(#shade)"/>
  <rect width="2400" height="720" fill="url(#horizonGlow)"/>
  <rect width="2400" height="720" fill="url(#vignette)"/>

  <g filter="url(#wordShadow)">
    <text x="1200" y="338" text-anchor="middle" fill="url(#wordmark)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="210" font-weight="700" letter-spacing="-10">Muxtra</text>
    <text x="1200" y="444" text-anchor="middle" fill="#d3cedc" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="52" font-weight="450" letter-spacing="-1.2">Many agents. One codebase.</text>
  </g>

  <line x1="1020" y1="520" x2="1380" y2="520" stroke="#9b89f2" stroke-opacity="0.42" stroke-width="2"/>
</svg>
