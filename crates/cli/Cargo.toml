[package]
name = "muxtra"
description = "A Linux base for Intel Macs, built for AI agents."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "muxtra"
path = "src/main.rs"

[dependencies]
muxtra-manifest = { path = "../manifest" }
clap = { version = "4.6", features = ["derive"] }
rpassword = "7.5"
sha-crypt = { version = "0.6", features = ["getrandom"] }
toml_edit = "0.25"

[dev-dependencies]
tempfile = "3"
